name: Train Meridian MMM

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilot first. Full is slower and may exceed free runner limits.'
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - full
      prior_mode:
        description: 'Baseline (independent) or oracle truth-informed calibration'
        required: true
        default: truth_wide
        type: choice
        options:
          - truth_wide
          - truth_moderate
          - baseline
      outcome:
        description: 'Train Stores, E-commerce, or both (sequentially)'
        required: true
        default: both
        type: choice
        options:
          - both
          - stores
          - ecommerce

permissions:
  contents: read

concurrency:
  group: meridian-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-meridian arviz pandas numpy scipy matplotlib xarray netCDF4
      - name: Validate input dataset
        run: |
          python - <<'PY'
          from retailiq.meridian_training import prepare_frame
          for outcome in ('stores', 'ecommerce'):
              frame, media, spend, raw = prepare_frame('sample_data/meridian_weekly_inputs.csv', outcome)
              print(outcome, len(frame), len(media), 'subchannels')
          PY
      - name: Train selected models
        run: python -u scripts/train_meridian.py --mode '${{ inputs.mode }}' --outcome '${{ inputs.outcome }}' --prior-mode '${{ inputs.prior_mode }}'
      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ inputs.mode }}-${{ inputs.outcome }}-${{ inputs.prior_mode }}-${{ github.run_number }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
